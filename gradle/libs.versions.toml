[versions]
# Newest non-preview releases on Maven Central at the time of writing (see
# https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml
# and https://repo1.maven.org/maven2/org/jetbrains/compose/compose-gradle-plugin/maven-metadata.xml).
# Compose Multiplatform 1.8+ requires at least Kotlin 2.1.0 (2.2.20+ for iOS
# and web); Kotlin 2.4.20 clears that easily. Per Kotlin's multiplatform
# compatibility guide, Kotlin 2.4.20 supports Gradle 7.6.3-9.7.0 and AGP
# 8.5.2-9.3.1, so Gradle 8.14.5 and AGP 8.9.1 (below) are both in range.
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
agp = "8.9.1"
androidx-activity-compose = "1.9.3"
androidx-appcompat = "1.7.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
