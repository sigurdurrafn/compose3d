org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true

# Apple targets (iosArm64, iosSimulatorArm64) can only be linked from a macOS
# host. Declaring them lets commonMain be checked against their API surface
# everywhere; this flag keeps Gradle from hard-failing when the host (e.g.
# Linux CI) cannot build them, instead of dropping the target configuration.
kotlin.native.ignoreDisabledTargets=true
# Kotlin 1.9.20+ eagerly provisions (downloads) the Kotlin/Native compiler
# during project configuration as soon as a native target is declared, even
# for an unrelated task like :common:compileKotlinJvm; setting this alone did
# not avoid it, so iosArm64/iosSimulatorArm64 are also opt-out below.
kotlin.native.toolchain.enabled=false

# iosArm64/iosSimulatorArm64 are declared by default (see engine/build.gradle.kts);
# pass -PskipNative=true where the Kotlin/Native compiler cannot be downloaded.
skipNative=false

# wasmJs is still experimental in Compose Multiplatform 1.6.2.
org.jetbrains.compose.experimental.wasm.enabled=true

# engine and common wire their own source set hierarchy (skikoMain) instead
# of the default template.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Android depends on AGP and androidx, which are published only to Google's
# Maven repository. Pass -PskipAndroid=true to build without it (see
# settings.gradle.kts, android/build.gradle.kts, common/build.gradle.kts).
skipAndroid=false
