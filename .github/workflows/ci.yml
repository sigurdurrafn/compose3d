name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: engine and desktop tests, wasm compile
        run: ./gradlew --no-daemon :engine:jvmTest :desktop:jvmTest :common:compileKotlinWasmJs

      - name: Android compile
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model3d-snapshot
          path: desktop/build/snapshots/model3d.png
          if-no-files-found: error

  # Optional: verifies common's iOS target actually compiles. Not required
  # for the other jobs to pass; iOS cannot be linked from a non-macOS host
  # at all, so this is the only place it is checked.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: iOS simulator compile
        run: ./gradlew --no-daemon :common:compileKotlinIosSimulatorArm64
